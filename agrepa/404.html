<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Página no encontrada | Agrepa Asfalcem</title>
<link rel="icon" href="https://zerogapcode.github.io/agrepa-web/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500&display=swap">
<style>
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:#0B0B0C;color:#F2F0ED;
    font-family:Barlow,system-ui,-apple-system,"Segoe UI",sans-serif;
    display:flex;align-items:center;justify-content:center;
    padding:clamp(18px,4.4vw,64px);
    padding-bottom:calc(clamp(18px,4.4vw,64px) + env(safe-area-inset-bottom,0px));
    text-align:center;
  }
  .caja{max-width:520px}
  .logo{width:min(200px,52vw);height:auto;margin:0 0 clamp(28px,6vw,40px)}
  .codigo{
    font-family:"Archivo Black",Impact,sans-serif;
    font-size:clamp(4rem,18vw,7rem);line-height:.9;
    color:#F6B10B;margin:0;letter-spacing:-.02em;
  }
  h1{
    font-family:"Barlow Condensed",Barlow,sans-serif;
    font-weight:700;text-transform:uppercase;letter-spacing:.02em;
    font-size:clamp(1.5rem,5vw,2.25rem);
    margin:clamp(14px,3vw,20px) 0 0;
  }
  p{color:#C7C4BF;font-size:clamp(1rem,2.5vw,1.0625rem);line-height:1.6;margin:14px 0 0}
  .btn{
    display:inline-block;margin-top:clamp(26px,5vw,34px);
    background:#F6B10B;color:#0B0B0C;text-decoration:none;
    font-family:"Barlow Condensed",Barlow,sans-serif;font-weight:700;
    text-transform:uppercase;letter-spacing:.06em;font-size:1.0625rem;
    padding:15px 30px;border:2px solid #F6B10B;
    transition:background .18s ease,color .18s ease;
  }
  .btn:hover,.btn:focus-visible{background:transparent;color:#F6B10B}
  @media (max-width:479px){ .btn{display:block} }
</style>
</head>
<body>
  <main class="caja">
    <img class="logo" src="https://zerogapcode.github.io/agrepa-web/img/logo-agrepa-460.webp" width="460" height="184" alt="Agrepa Asfalcem">
    <p class="codigo">404</p>
    <h1>Esta vía no existe</h1>
    <p>La página que buscas fue movida o nunca estuvo aquí. Volvamos al camino principal.</p>
    <a class="btn" href="https://zerogapcode.github.io/agrepa-web/">Ir al inicio</a>
  </main>
</body>
</html>
