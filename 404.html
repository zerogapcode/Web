<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>404 – ProtonLab</title>
  <meta name="description" content="The page you are looking for does not exist on ProtonLab." />
  <meta name="robots" content="noindex" />
  <!-- GitHub Pages sirve este archivo desde cualquier ruta: todas las rutas son absolutas -->
  <link rel="icon" href="/images/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <script>
    // Aplica el tema guardado antes de pintar para evitar un destello blanco en modo oscuro
    (function () {
      var mode = 'auto';
      try { mode = localStorage.getItem('protonlab_theme') || 'auto'; } catch (e) {}
      if (mode === 'auto') mode = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = mode;
    })();
  </script>
  <style>
    :root {
      --bg: #ffffff;
      --text: #000000;
      --muted: #6b7280;
      --line: rgba(0, 0, 0, 0.08);
      --header-bg: rgba(255, 255, 255, 0.95);
      --ink: 0, 0, 0;
      --glass: rgba(255, 255, 255, 0.55);
      --panel-alpha: 0.18;
      --panel-border-alpha: 0.5;
      --panel-text: #6b7280;
      --accent: 100, 180, 255;
      --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, monospace;
    }
    :root[data-theme='dark'] {
      --bg: #000000;
      --text: #f0f0f0;
      --muted: #888888;
      --line: rgba(255, 255, 255, 0.1);
      --header-bg: rgba(0, 0, 0, 0.95);
      --ink: 255, 255, 255;
      --glass: rgba(0, 0, 0, 0.55);
      --panel-alpha: 0.12;
      --panel-border-alpha: 0.4;
      --panel-text: #888888;
    }

    * { box-sizing: border-box; font-family: var(--mono); }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      overflow-x: hidden;
    }

    /* Paneles de cristal con código: mismos estilos que el fondo de la portada */
    .panels {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }
    .panel {
      --c: 100, 180, 255;
      position: absolute;
      border-radius: 8px;
      overflow: hidden;
      background: rgba(var(--c), var(--panel-alpha));
      border: 1px solid rgba(var(--c), var(--panel-border-alpha));
      box-shadow: 0 18px 40px rgba(var(--c), 0.25);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      transform: translate3d(0, 0, 0);
      will-change: transform;
    }
    .panel.color-red    { --c: 255, 100, 100; }
    .panel.color-orange { --c: 255, 165, 80; }
    .panel.color-yellow { --c: 255, 220, 100; }
    .panel.color-green  { --c: 100, 220, 150; }
    .panel.color-blue   { --c: 100, 180, 255; }
    .panel.color-violet { --c: 180, 120, 255; }

    .panel.large  { width: 280px; height: 140px; z-index: 3; opacity: 0.95; }
    .panel.medium { width: 220px; height: 110px; z-index: 2; opacity: 0.85; }
    .panel.small  { width: 150px; height: 75px;  z-index: 1; opacity: 0.7; }
    @media (min-width: 768px) {
      .panel.large  { width: 320px; height: 160px; }
      .panel.medium { width: 250px; height: 125px; }
      .panel.small  { width: 180px; height: 90px; }
    }

    .panel .inner {
      height: 100%;
      padding: 10px;
      color: var(--panel-text);
      overflow: hidden;
    }
    .panel.large .inner  { font-size: 11px; line-height: 1.3; }
    .panel.medium .inner { font-size: 10px; line-height: 1.3; }
    .panel.small .inner  { font-size: 9px;  line-height: 1.2; }
    @media (min-width: 768px) {
      .panel .inner { padding: 12px; }
      .panel.large .inner  { font-size: 12px; }
      .panel.medium .inner { font-size: 11px; }
      .panel.small .inner  { font-size: 10px; }
    }
    .code-line {
      white-space: pre;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    header {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 70px;
      display: flex;
      align-items: center;
      padding: 14px 20px;
      background: var(--header-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line);
      z-index: 2;
    }
    .mini {
      font-weight: 700;
      font-size: 20px;
      letter-spacing: 0.12em;
      color: var(--text);
      text-decoration: none;
      transition: transform 0.3s ease;
    }
    .mini:hover { transform: scale(1.1); }

    main {
      position: relative;
      z-index: 1;
      min-height: 100%;
      max-width: 1100px;
      margin: 0 auto;
      padding: 110px 24px 60px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .code-title {
      font-size: clamp(56px, 16vw, 128px);
      line-height: 1;
      letter-spacing: 0.02em;
      margin: 0;
      font-weight: 700;
      white-space: nowrap;
    }
    .code-title .num {
      display: inline-block;
      min-width: 3ch;
      text-align: center;
    }
    .subtitle {
      display: block;
      margin-top: 14px;
      font-size: 16px;
      color: var(--muted);
    }

    .terminal {
      margin: 36px 0 0;
      max-width: 640px;
      padding: 18px 20px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--glass);
      backdrop-filter: blur(16px) saturate(160%);
      -webkit-backdrop-filter: blur(16px) saturate(160%);
      font-size: 13px;
      line-height: 1.8;
      overflow-wrap: anywhere;
    }
    .terminal .prompt { color: var(--muted); }
    .terminal .path { color: rgb(var(--accent)); font-weight: 600; }
    .terminal .status { color: #ff6464; font-weight: 600; }
    .cursor {
      display: inline-block;
      width: 0.6em;
      height: 1.1em;
      vertical-align: text-bottom;
      background: var(--text);
      animation: blink 1s steps(1) infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }

    p.lead {
      max-width: 640px;
      margin: 28px 0 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.7;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 32px;
    }
    .btn {
      display: inline-block;
      padding: 12px 32px;
      border-radius: 999px;
      font-weight: 600;
      font-size: 14px;
      letter-spacing: 0.05em;
      text-decoration: none;
      color: var(--text);
      background: rgba(var(--accent), 0.15);
      border: 1px solid rgba(var(--accent), 0.3);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      transition: transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94), box-shadow 0.4s ease, border-color 0.4s ease;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 40px rgba(var(--accent), 0.4);
      border-color: rgb(var(--accent));
    }
    .btn.secondary {
      background: transparent;
      border-color: var(--line);
    }
    .btn:focus-visible,
    .mini:focus-visible {
      outline: 2px solid rgb(var(--accent));
      outline-offset: 3px;
    }

    footer {
      position: relative;
      z-index: 1;
      padding: 0 24px 40px;
      text-align: center;
      color: var(--muted);
      font-size: 12px;
    }

    @media (max-width: 480px) {
      .btn { flex: 1 1 100%; text-align: center; }
    }
    @media (prefers-reduced-motion: reduce) {
      .cursor { animation: none; }
      .btn, .mini { transition: none; }
    }
  </style>
</head>
<body>
  <div class="panels" id="panels" aria-hidden="true"></div>

  <header>
    <a class="mini" href="/" aria-label="ProtonLab – Home" data-i18n-aria="home_aria">&lt;/&gt;</a>
  </header>

  <main>
    <h1 class="code-title">&lt;<span class="num" id="num">404</span>&gt;
      <small class="subtitle" data-i18n="subtitle">Page not found.</small>
    </h1>

    <div class="terminal" role="note">
      <div><span class="prompt">$</span> GET <span class="path" id="req-path">/</span></div>
      <div><span class="prompt">&gt;</span> <span class="status">404 Not Found</span></div>
      <div><span class="prompt">$</span> <span class="cursor" aria-hidden="true"></span></div>
    </div>

    <p class="lead" data-i18n="lead">The page you are looking for does not exist, was moved, or never compiled. Check the address or go back to the lab.</p>

    <div class="actions">
      <a class="btn" href="/" data-i18n="btn_home">Back to home</a>
      <a class="btn secondary" href="/contacto.html" data-i18n="btn_contact">Contact</a>
    </div>
  </main>

  <footer>© ProtonLab – www.protonlab.site</footer>

  <script>
    (function () {
      var translations = {
        subtitle: { en: 'Page not found.', es: 'Página no encontrada.', pt: 'Página não encontrada.' },
        lead: {
          en: 'The page you are looking for does not exist, was moved, or never compiled. Check the address or go back to the lab.',
          es: 'La página que buscas no existe, se movió o nunca llegó a compilar. Revisa la dirección o vuelve al laboratorio.',
          pt: 'A página que você procura não existe, foi movida ou nunca chegou a compilar. Verifique o endereço ou volte ao laboratório.'
        },
        btn_home: { en: 'Back to home', es: 'Volver al inicio', pt: 'Voltar ao início' },
        btn_contact: { en: 'Contact', es: 'Contacto', pt: 'Contato' },
        home_aria: { en: 'ProtonLab – Home', es: 'ProtonLab – Inicio', pt: 'ProtonLab – Início' },
        title: { en: '404 – Page not found · ProtonLab', es: '404 – Página no encontrada · ProtonLab', pt: '404 – Página não encontrada · ProtonLab' }
      };

      // Idioma: el que el visitante eligió en la web; si no, el del navegador
      var lang = null;
      try { lang = localStorage.getItem('protonlab_lang'); } catch (e) {}
      if (!translations.subtitle[lang]) {
        var nav = (navigator.language || 'en').slice(0, 2).toLowerCase();
        lang = translations.subtitle[nav] ? nav : 'en';
      }
      document.documentElement.lang = lang;
      document.title = translations.title[lang];
      document.querySelectorAll('[data-i18n]').forEach(function (el) {
        el.textContent = translations[el.getAttribute('data-i18n')][lang];
      });
      document.querySelectorAll('[data-i18n-aria]').forEach(function (el) {
        el.setAttribute('aria-label', translations[el.getAttribute('data-i18n-aria')][lang]);
      });
      // Enlaces a la portada en el idioma activo
      if (lang !== 'en') {
        document.querySelectorAll('a[href="/"]').forEach(function (a) { a.href = '/?lang=' + lang; });
      }

      // Ruta solicitada (textContent: nunca se interpreta como HTML)
      var path = window.location.pathname + window.location.search;
      try { path = decodeURIComponent(path); } catch (e) {}
      document.getElementById('req-path').textContent = path.length > 80 ? path.slice(0, 77) + '...' : path;

      // Mismo acento aleatorio que los botones flotantes de la portada
      var palettes = ['255, 100, 100', '255, 165, 80', '255, 220, 100', '100, 220, 150', '100, 180, 255', '180, 120, 255'];
      document.documentElement.style.setProperty('--accent', palettes[Math.floor(Math.random() * palettes.length)]);

      var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      // Animación del título: caracteres aleatorios que se resuelven en "404"
      var num = document.getElementById('num');
      var target = '404';
      var chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%&*?<>';
      if (!reduceMotion) {
        var start = Date.now();
        var timer = setInterval(function () {
          var progress = (Date.now() - start) / 1400;
          var solved = Math.min(target.length, Math.floor(progress * target.length));
          var out = '';
          for (var i = 0; i < target.length; i++) {
            out += i < solved ? target[i] : chars[Math.floor(Math.random() * chars.length)];
          }
          num.textContent = out;
          if (solved >= target.length) clearInterval(timer);
        }, 60);
      }

      // Paneles de cristal con código, como el fondo de la portada (versión 404)
      var panelContent = {
        large: [
          { speed: 0.9, lines: ['// Buscando página...', 'const res = await fetch(path);', 'if (!res.ok) {', '  throw new Error(res.status);', '}', '// Error: 404'] },
          { speed: 0.8, lines: ['#include <stdio.h>', 'int main() {', '  FILE *f = fopen(path, "r");', '  if (!f) return 404;', '}', 'exit> 404'] },
          { speed: 0.7, lines: ['// Lectura sensor', 'val = analogRead(PAGE);', 'if (val == NULL) {', '  digitalWrite(LED, HIGH);', '  blink(404);', '}'] },
          { speed: 0.6, lines: ['class Page {', '  constructor(path) {', '    this.path = path;', '    this.found = false;', '  }', '}', 'new Page(path); // 404'] }
        ],
        medium: [
          { speed: 0.5, lines: ['-- Buscar página', 'SELECT * FROM pages', '  WHERE path = :path;', '-- 0 rows returned'] },
          { speed: 0.45, lines: ['$ git checkout page', 'error: pathspec', "  'page' did not match", '  any file(s) known'] },
          { speed: 0.4, lines: ['guard let page = find(path)', 'else {', '  return .notFound', '}', '// 404'] },
          { speed: 0.35, lines: ['$ ping page.html', 'Request timeout', 'Request timeout', '100% packet loss'] },
          { speed: 0.3, lines: ['try:', '  open(path)', 'except FileNotFoundError:', '  print(404)'] }
        ],
        small: [
          { speed: 0.25, lines: ['$ ls page.html', 'No such file', 'or directory'] },
          { speed: 0.2, lines: ['HTTP/1.1 404', 'Not Found', 'content: none'] },
          { speed: 0.18, lines: ['DEBUG MODE', 'WARNING: path', 'not resolved'] },
          { speed: 0.15, lines: ['test page.js', '✗ 0/1 passed', 'page missing'] },
          { speed: 0.12, lines: ['CPU: 0% load', 'PAGE: null', 'NET: 404'] },
          { speed: 0.1, lines: ['docker run page', 'image: not found', 'exit code 404'] }
        ]
      };
      // Zonas de colocación y tamaño aproximado (en %) de cada tipo, igual que en la portada
      var zones = {
        large:  { left: [2, 70], top: [15, 70], w: 20, h: 15 },
        medium: { left: [5, 75], top: [10, 75], w: 16, h: 12 },
        small:  { left: [8, 82], top: [5, 80],  w: 12, h: 8 }
      };
      var colors = ['color-red', 'color-orange', 'color-yellow', 'color-green', 'color-blue', 'color-violet'];
      var isMobile = window.innerWidth <= 768;
      var perSize = isMobile ? { large: 2, medium: 3, small: 3 } : { large: 4, medium: 5, small: 6 };
      var occupied = [];
      var placed = [];

      function shuffle(arr) {
        var a = arr.slice();
        for (var i = a.length - 1; i > 0; i--) {
          var j = Math.floor(Math.random() * (i + 1));
          var t = a[i]; a[i] = a[j]; a[j] = t;
        }
        return a;
      }
      function rand(range) { return range[0] + Math.random() * (range[1] - range[0]); }
      function overlaps(a, b) {
        var m = 5;
        return !(a.left + a.w + m < b.left || a.left > b.left + b.w + m ||
                 a.top + a.h + m < b.top || a.top > b.top + b.h + m);
      }
      function findPosition(zone) {
        var pos;
        for (var attempt = 0; attempt < 50; attempt++) {
          pos = { left: rand(zone.left), top: rand(zone.top), w: zone.w, h: zone.h };
          if (!occupied.some(function (o) { return overlaps(pos, o); })) break;
        }
        occupied.push(pos);
        return pos;
      }

      // Escribe las líneas carácter a carácter, en bucle (mismos tiempos que la portada)
      function typePanel(inner, lines, isSmall) {
        var lineIndex = 0;
        function nextLine() {
          if (lineIndex >= lines.length) {
            setTimeout(function () {
              inner.textContent = '';
              lineIndex = 0;
              setTimeout(nextLine, isSmall ? 500 : 800);
            }, isSmall ? 1500 : 2000);
            return;
          }
          var text = lines[lineIndex];
          var lineEl = document.createElement('div');
          lineEl.className = 'code-line';
          inner.appendChild(lineEl);
          var speed = isSmall ? 25 + Math.random() * 20 : 40 + Math.random() * 30;
          var i = 0;
          (function typeChar() {
            if (i < text.length) {
              var ch = text.charAt(i++);
              lineEl.textContent += ch;
              var delay = speed;
              if (ch === '.' || ch === ';' || ch === '}') delay = speed * 3;
              else if (ch === ',' || ch === ' ') delay = speed * 1.5;
              setTimeout(typeChar, delay);
            } else {
              lineIndex++;
              setTimeout(nextLine, 1000 + (isSmall ? 200 : 300));
            }
          })();
        }
        nextLine();
      }

      var panelsEl = document.getElementById('panels');
      ['large', 'medium', 'small'].forEach(function (size) {
        var sizeColors = shuffle(colors);
        panelContent[size].slice(0, perSize[size]).forEach(function (c, index) {
          var pos = findPosition(zones[size]);
          var el = document.createElement('div');
          el.className = 'panel ' + size + ' ' + sizeColors[index % sizeColors.length];
          el.style.left = pos.left.toFixed(1) + '%';
          el.style.top = pos.top.toFixed(1) + '%';
          var inner = document.createElement('div');
          inner.className = 'inner';
          el.appendChild(inner);
          panelsEl.appendChild(el);
          placed.push({ el: el, speed: c.speed });
          if (reduceMotion) {
            c.lines.forEach(function (line) {
              var lineEl = document.createElement('div');
              lineEl.className = 'code-line';
              lineEl.textContent = line;
              inner.appendChild(lineEl);
            });
          } else {
            typePanel(inner, c.lines, size === 'small');
          }
        });
      });

      if (reduceMotion) return;

      // Parallax: la 404 no suele tener scroll, así que los paneles también siguen al ratón.
      // Cada panel se desplaza según su "speed": los grandes (cercanos) más, los pequeños menos.
      var MAX_SHIFT = 40;
      var pointer = { x: 0, y: 0 };
      var current = { x: 0, y: 0 };
      var scrollY = window.scrollY;
      var rafId = null;

      function render() {
        current.x += (pointer.x - current.x) * 0.08;
        current.y += (pointer.y - current.y) * 0.08;
        placed.forEach(function (p) {
          var x = -current.x * MAX_SHIFT * p.speed;
          var y = -current.y * MAX_SHIFT * p.speed - scrollY * p.speed;
          p.el.style.transform = 'translate3d(' + x.toFixed(1) + 'px, ' + y.toFixed(1) + 'px, 0)';
        });
        var moving = Math.abs(pointer.x - current.x) > 0.001 || Math.abs(pointer.y - current.y) > 0.001;
        rafId = moving ? requestAnimationFrame(render) : null;
      }
      function schedule() {
        if (!rafId) rafId = requestAnimationFrame(render);
      }
      window.addEventListener('pointermove', function (e) {
        if (e.pointerType !== 'mouse') return;
        pointer.x = Math.max(-1, Math.min(1, (e.clientX / window.innerWidth) * 2 - 1));
        pointer.y = Math.max(-1, Math.min(1, (e.clientY / window.innerHeight) * 2 - 1));
        schedule();
      }, { passive: true });
      document.documentElement.addEventListener('mouseleave', function () {
        pointer.x = 0;
        pointer.y = 0;
        schedule();
      });
      window.addEventListener('scroll', function () {
        scrollY = window.scrollY;
        schedule();
      }, { passive: true });
    })();
  </script>
</body>
</html>
